<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styl.css">
    <title>Biuro turystyczne</title>
</head>
<body>
    <header>
        <h1>Rezerwacja wycieczek</h1>
    </header>
    <main>
        <div class="box1">
            <nav>
                <button onclick="uczestnik()" id="btn1">Uczestnik</button>
                <button onclick="rezerwacja()" id="btn2">Rezerwacja</button>
            </nav>
            <div class="box2">
                <section id="s1">
                    <h2>Dane klienta</h2>
                    <img src="osoba.png" alt="Klient" width="100">
                    <label for="imie">Imię</label>
                    <input type="text" id="imie">
                    <label for="nazwisko">Nazwisko</label>
                    <input type="text" id="nazwisko">
                    <p><a href="wycieczki.html">Do strony głównej</a></p>
                </section>
                <section id="s2">
                    <h2>Dane rezerwacji</h2>
                    <span onclick="prevNextFunction('prev')" id="prev">&lt;&lt;</span>
                    <img id="slider" src="1.jpg" alt="Wycieczka">
                    <span onclick="prevNextFunction('next')"  id="next">&gt;&gt;</span>
                    <h4 id="city">Barcelona</h4>
                    <label for="liczba">Liczba osób</label>
                    <input type="number" id="liczba" min="1" max="4" value="2" disabled>
                    <label for="miejsce">Miejsce wylotu</label>
                    <select id="miejsce" multiple disabled>
                        <option value="Warszawa">Warszawa</option>
                        <option value="Kraków">Kraków</option>
                        <option value="Wrocław">Wrocław</option>
                    </select>
                    <select disabled>
                        <option value="sniadania" selected>Śniadania</option>
                        <option value="obiady">Śniadania i obiadokolacje</option>
                        <option value="all">All inclusive</option>
                    </select>
                    <button>Sprawdź cenę</button>
                </section>
            </div>
        </div>
        <aside>
            <img src="1.jpg">
            <img src="2.jpg">
            <img src="3.jpg">
            <img src="1.jpg">
            <img src="2.jpg">
            <img src="3.jpg">
            <img src="1.jpg">
            <img src="2.jpg">
            <img src="3.jpg">
        </aside>
    </main>
    <footer>
        <p>Numer zdającego: <em>00000000000</em></p>
    </footer>
    <script src="scripts.js"></script>
</body>
</html>
